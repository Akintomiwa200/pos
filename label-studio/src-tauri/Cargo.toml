[package]
name = "label-studio-desktop"
version = "0.1.0"
description = "Label Studio desktop shell"
edition = "2021"
publish = false

[lib]
name = "label_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "label-studio-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"