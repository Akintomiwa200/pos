name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            web/pnpm-lock.yaml
            pos/pnpm-lock.yaml
            price-check/pnpm-lock.yaml

      - name: Build API, HQ, till UI, and price-check UI
        run: |
          set -e
          for app in backend web pos price-check; do
            pnpm --dir "$app" install --frozen-lockfile
            pnpm --dir "$app" build
          done

      - name: Pack portable UI and API build output
        run: |
          set -e
          mkdir -p dist-release
          (cd pos/dist && zip -r ../../dist-release/pos-ui-web.zip .)
          (cd price-check/dist && zip -r ../../dist-release/price-check-ui-web.zip .)
          (cd backend/dist && zip -r ../../dist-release/pos-api-dist.zip .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/pos-ui-web.zip
            dist-release/price-check-ui-web.zip
            dist-release/pos-api-dist.zip
          body: |
            Installable **Windows setup.exe** and **Android APK** are built on a
            Windows/Android machine — see [docs/build](https://github.com/Akintomiwa200/pos/blob/main/docs/build/README.md).

            This tag attaches compiled JS output:

            - `pos-ui-web.zip` — till web UI (`pos/dist`)
            - `price-check-ui-web.zip` — price-check web UI
            - `pos-api-dist.zip` — Nest API `dist/` (run with Node 22: `node main.js`)

            HQ (`web`) is a Next.js server; run `pnpm start` from a full `web/`
            install, not from a zip alone.

            GitHub **Packages** is not used. This product is not an npm library.
