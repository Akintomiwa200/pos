name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# native-installers.yml attaches EXE/MSI (and optionally APK/AAB) to the same
# Release. Share a concurrency group so the two tag workflows cannot race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            web/pnpm-lock.yaml
            pos/pnpm-lock.yaml
            price-check/pnpm-lock.yaml
            label-studio/pnpm-lock.yaml

      - name: Build API, HQ, till UI, price-check UI, and label studio UI
        run: |
          set -e
          for app in backend web pos price-check label-studio; do
            pnpm --dir "$app" install --frozen-lockfile
            pnpm --dir "$app" build
          done

      - name: Pack portable UI and API build output
        run: |
          set -e
          mkdir -p dist-release
          (cd pos/dist && zip -r ../../dist-release/pos-ui-web.zip .)
          (cd price-check/dist && zip -r ../../dist-release/price-check-ui-web.zip .)
          (cd label-studio/dist && zip -r ../../dist-release/label-studio-ui-web.zip .)
          (cd backend && zip -r ../dist-release/pos-api-dist.zip dist package.json pnpm-lock.yaml .env.example)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/pos-ui-web.zip
            dist-release/price-check-ui-web.zip
            dist-release/label-studio-ui-web.zip
            dist-release/pos-api-dist.zip
          body: |
            Windows **EXE + MSI** installers for pos, price-check and label-studio
            are built by the Native installers workflow on this tag and attached
            here when it succeeds. They are unsigned. Android APK/AAB are skipped
            until an Android project is committed — see
            [docs/build](https://github.com/Akintomiwa200/pos/blob/main/docs/build/README.md).

            This job attaches compiled JS output:

            - `pos-ui-web.zip` — till web UI (`pos/dist`)
            - `price-check-ui-web.zip` — price-check web UI
            - `label-studio-ui-web.zip` — label studio web UI
            - `pos-api-dist.zip` — Nest API `dist/` plus `package.json`, lockfile and `.env.example`; run `pnpm install --frozen-lockfile`, then `node dist/main.js` with Node 22 and a configured `DATABASE_URL`

            HQ (`web`) is a Next.js server; run `pnpm start` from a full `web/`
            install, not from a zip alone.

            GitHub **Packages** is not used. This product is not an npm library.
